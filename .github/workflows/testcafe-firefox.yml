name: TestCafe Firefox (loads games, clicks buttons, checks the results)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: testcafe-firefox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Run TestCafe Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testfile:
          - publiclibrary-1.js
        rep: [ a, b, c, d, e, f, g, h, i, j, k, l ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Start virtualtabletop server
      run: |
        npm start > server.log 2>&1 &
        timeout 30 bash -c 'until curl -sf http://localhost:8272 -o /dev/null; do sleep 0.5; done'
    - name: Run TestCafe tests
      run: |
        firefox --version
        fails=0
        for i in $(seq 10); do
          echo "=== iteration $i"
          npx testcafe firefox:headless tests/testcafe/${{ matrix.testfile }} -s path=screenshots/$i,takeOnFails=true || fails=$((fails+1))
        done
        echo "FAILED ITERATIONS: $fails"
        test $fails = 0
    - name: Upload screenshots and server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: diag-${{ matrix.testfile }}-${{ matrix.rep }}
        path: |
          screenshots
          server.log
