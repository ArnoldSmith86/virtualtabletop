name: TestCafe Firefox (loads games, clicks buttons, checks the results)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: testcafe-firefox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Run TestCafe Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testfile:
          - editor.js
          - connection.js
          - compute-1.js
          - compute-2.js
          - compute-3.js
          - compute-4.js
          - publiclibrary-1.js
          - publiclibrary-2.js
          - publiclibrary-3.js
          - publiclibrary-4.js
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Start virtualtabletop server
      run: |
        npm start &
        timeout 30 bash -c 'until curl -sf http://localhost:8272 -o /dev/null; do sleep 0.5; done'
    - name: Run TestCafe tests
      uses: DevExpress/testcafe-action@latest
      with:
        version: "3.7.3"
        args: "firefox:headless tests/testcafe/${{ matrix.testfile }}"
