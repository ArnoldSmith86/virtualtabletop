name: TestCafe Firefox (loads games, clicks buttons, checks the results)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: testcafe-firefox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Run TestCafe Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testfile:
          - publiclibrary-1.js
        library: [ main, pr3189 ]
        rep: [ a, b, c, d, e, f, g, h ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: TEMPORARY - environment
      run: |
        firefox --version; uname -a; nproc; free -m; fc-list | wc -l; locale; echo "TZ=$TZ"; xdpyinfo 2>/dev/null | head -5 || true
    - name: TEMPORARY - use the Six Slimy Sailors file of PR 3189
      if: matrix.library == 'pr3189'
      run: |
        git fetch --depth=1 origin 1b5645b6f255d2e5f50621aeb496fb71e561f5df
        git show 1b5645b6f255d2e5f50621aeb496fb71e561f5df:"library/games/Six Slimy Sailors/0.json" > "library/games/Six Slimy Sailors/0.json"
        git status --short
    - name: Start virtualtabletop server
      run: |
        npm start &
        timeout 30 bash -c 'until curl -sf http://localhost:8272 -o /dev/null; do sleep 0.5; done'
    - name: Run TestCafe tests
      uses: DevExpress/testcafe-action@latest
      with:
        version: "3.7.3"
        args: "firefox:headless tests/testcafe/${{ matrix.testfile }} -s path=screenshots,takeOnFails=true"
    - name: Upload screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-${{ matrix.testfile }}-${{ matrix.library }}-${{ matrix.rep }}
        path: screenshots
