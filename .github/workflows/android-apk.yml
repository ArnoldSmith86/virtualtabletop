name: Android APK (builds the app that runs the server on a phone)

# The ubuntu runners ship a JDK, node, xz and the Android SDK, so .android/build-apk.sh and
# .android/test/run.sh need nothing else: the tests compile the app's own classes against stubs of
# the Android ones and run them here, leaving the installation itself and how the screen looks to
# a phone. The APK is attached to the run so it can be installed without a local SDK; it is signed
# with the committed key, so it installs over a build from any other run or from a local machine.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.android/**', '.github/workflows/android-apk.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ '.android/**', '.github/workflows/android-apk.yml' ]

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # the whole history: the version the APK carries is the number of commits, which a
        # shallow checkout would report as 1
        fetch-depth: 0
    # the APK the main README links to is committed, so a change to the app that forgets to
    # refresh it would leave everyone downloading a build older than the sources it is reviewed as
    - name: Check that the committed APK was refreshed
      if: github.event_name == 'pull_request'
      run: |
        base=${{ github.event.pull_request.base.sha }}
        git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$base"
        changed() { git diff --name-only "$base" HEAD -- "$@" | grep -q .; }
        if changed .android/src .android/res .android/AndroidManifest.xml && ! changed .android/VirtualTabletop.apk; then
          echo "The app changed but .android/VirtualTabletop.apk did not. Build it and copy it"
          echo "over - see .android/README.md."
          exit 1
        fi
    - name: Test the xz decoder, the installer, the server state machine and the screen
      run: .android/test/run.sh
    - name: Build the APK
      run: .android/build-apk.sh
    - name: Attach the APK to the run
      uses: actions/upload-artifact@v4
      with:
        name: VirtualTabletop-android
        path: .android/out/*.apk
